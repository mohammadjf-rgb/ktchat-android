name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Rebuild source archive
        run: |
          cat srcparts/part01 srcparts/part02a srcparts/part02b srcparts/part03 srcparts/part04 srcparts/part05 srcparts/part06 srcparts/part07 srcparts/part08 > project.b64
          base64 -d project.b64 > KT-Chat-Android-v1.0.14-project.zip
          echo "5d69fa01e45297cd9ca7a7088797a3be78f3d26c5f2c9d8415e9d9eb5adaed73  KT-Chat-Android-v1.0.14-project.zip" | sha256sum -c -
          mkdir -p project
          unzip -q KT-Chat-Android-v1.0.14-project.zip -d project
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'
      - name: Build debug APK
        working-directory: project
        run: gradle :app:assembleDebug --stacktrace
      - name: Rename APK
        run: cp project/app/build/outputs/apk/debug/app-debug.apk KT-Chat-v1.0.14.apk
      - uses: actions/upload-artifact@v4
        with:
          name: KT-Chat-Android-v1.0.14
          path: KT-Chat-v1.0.14.apk
