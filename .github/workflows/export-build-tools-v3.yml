name: Export Android build tools v3

on:
  push:
    paths:
      - ".github/workflows/export-build-tools-v3.yml"

env:
  ANDROID_HOME: /usr/local/lib/android/sdk
  ANDROID_SDK_ROOT: /usr/local/lib/android/sdk

jobs:
  export:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Android SDK 35
        run: |
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" "platforms;android-35" "build-tools;35.0.0"
      - name: Collect tools
        run: |
          mkdir -p export/platform export/build-tools/lib export/build-tools/lib64
          cp "$ANDROID_HOME/platforms/android-35/android.jar" export/platform/
          cp "$ANDROID_HOME/build-tools/35.0.0/lib/d8.jar" export/build-tools/lib/
          cp "$ANDROID_HOME/build-tools/35.0.0/lib/apksigner.jar" export/build-tools/lib/
          cp "$ANDROID_HOME/build-tools/35.0.0/zipalign" export/build-tools/
          cp "$ANDROID_HOME/build-tools/35.0.0/aapt" export/build-tools/
          cp "$ANDROID_HOME/build-tools/35.0.0/dexdump" export/build-tools/
          LIBCPP="$(find "$ANDROID_HOME/build-tools/35.0.0" -name 'libc++.so' -type f | head -1)"
          test -n "$LIBCPP"
          cp "$LIBCPP" export/build-tools/lib64/libc++.so
          chmod +x export/build-tools/zipalign export/build-tools/aapt export/build-tools/dexdump
      - uses: actions/upload-artifact@v4
        with:
          name: android-build-tools-35-export-v3
          path: export
