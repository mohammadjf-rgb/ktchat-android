name: Build KT-Chat Android v1.0.15

on:
  workflow_dispatch:
  push:
    branches: [ main ]

env:
  ANDROID_HOME: /usr/local/lib/android/sdk
  ANDROID_SDK_ROOT: /usr/local/lib/android/sdk

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Prepare v1.0.15 source
        run: |
          rm -rf work project
          mkdir -p work
          unzip -q KT-Chat-Android-v1.0.14-SOURCE.zip -d work
          PROJECT_DIR="$(find work -maxdepth 2 -type f -name settings.gradle -printf '%h\n' | head -1)"
          test -n "$PROJECT_DIR"
          gzip -dc KT-Chat-Android-v1.0.15.patch.gz > /tmp/ktchat-v115.patch
          patch -d "$PROJECT_DIR" -p1 < /tmp/ktchat-v115.patch
          grep -q "versionName '1.0.15'" "$PROJECT_DIR/app/build.gradle"
          grep -q "KTChatNotificationService" "$PROJECT_DIR/app/src/main/AndroidManifest.xml"
          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Android SDK 35
        run: |
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          test -x "$SDKMANAGER"
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" "platform-tools" "platforms;android-35" "build-tools;35.0.0"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'

      - name: Build APK
        run: gradle -p "$PROJECT_DIR" :app:assembleDebug --stacktrace

      - name: Prepare artifacts
        run: |
          cp "$PROJECT_DIR/app/build/outputs/apk/debug/app-debug.apk" KT-Chat-v1.0.15.apk
          sha256sum KT-Chat-v1.0.15.apk > KT-Chat-v1.0.15.apk.sha256
          (cd "$PROJECT_DIR" && zip -qr "$GITHUB_WORKSPACE/KT-Chat-Android-v1.0.15-SOURCE.zip" .)
          sha256sum KT-Chat-Android-v1.0.15-SOURCE.zip > KT-Chat-Android-v1.0.15-SOURCE.zip.sha256

      - uses: actions/upload-artifact@v4
        with:
          name: KT-Chat-Android-v1.0.15
          path: |
            KT-Chat-v1.0.15.apk
            KT-Chat-v1.0.15.apk.sha256
            KT-Chat-Android-v1.0.15-SOURCE.zip
            KT-Chat-Android-v1.0.15-SOURCE.zip.sha256
